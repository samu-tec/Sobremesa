name: sobremesa

services:
  sobremesa:
    build: .
    image: sobremesa:latest
    container_name: sobremesa
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - cloudflare
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://games.samuelciocan.com,http://localhost:3000,http://127.0.0.1:3000}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      DISCONNECT_GRACE_PERIOD_MS: ${DISCONNECT_GRACE_PERIOD_MS:-300000}
      BOT_THINKING_TIME_MS: ${BOT_THINKING_TIME_MS:-650}
      MAX_ROOMS: ${MAX_ROOMS:-500}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-2000}
      ROOM_CREATE_LIMIT_PER_IP: ${ROOM_CREATE_LIMIT_PER_IP:-10}
      ROOM_CREATE_LIMIT_GLOBAL: ${ROOM_CREATE_LIMIT_GLOBAL:-30}
      ROOM_CREATE_WINDOW_MS: ${ROOM_CREATE_WINDOW_MS:-60000}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 10s

networks:
  cloudflare:
    name: cloudflare
    external: true
