name: sobremesa

services:
  sobremesa:
    build: .
    image: sobremesa:latest
    container_name: sobremesa
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - cloudflare
    environment:
      ALLOWED_ORIGINS:
      TRUSTED_CLOUDFLARE_IPS:
      DISCONNECT_GRACE_PERIOD_MS:
      BOT_THINKING_TIME_MS:
      MAX_ROOMS:
      MAX_CONNECTIONS:
      ROOM_CREATE_LIMIT_PER_IP:
      ROOM_CREATE_LIMIT_GLOBAL:
      ROOM_CREATE_WINDOW_MS:
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 10s

networks:
  cloudflare:
    name: cloudflare
    external: true
