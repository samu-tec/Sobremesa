services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: games-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional Cloudflare Tunnel service (cloudflared) for games.samuelciocan.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: games-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - game-server
    profiles:
      - tunnel
